name: Gerar APK OTTHI World Edu

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL do GitHub Pages (deixe vazio para detectar automaticamente)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Definir endereço do jogo
        shell: bash
        env:
          INPUT_APP_URL: ${{ inputs.app_url }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repo_name="${REPOSITORY#*/}"
          if [ -n "${INPUT_APP_URL}" ]; then
            app_url="${INPUT_APP_URL}"
          elif [ "${repo_name,,}" = "${OWNER,,}.github.io" ]; then
            app_url="https://${OWNER}.github.io/"
          else
            app_url="https://${OWNER}.github.io/${repo_name}/"
          fi
          case "$app_url" in
            http://*|https://*) ;;
            *) echo "URL inválida: $app_url"; exit 1 ;;
          esac
          [[ "$app_url" == */ ]] || app_url="$app_url/"
          echo "APP_URL=$app_url" >> "$GITHUB_ENV"
          export APP_URL="$app_url"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('android-app/app/src/main/res/values/strings.xml')
          text = p.read_text(encoding='utf-8')
          text = text.replace('__APP_URL__', os.environ['APP_URL'])
          p.write_text(text, encoding='utf-8')
          print('APK apontará para:', os.environ['APP_URL'])
          PY

      - name: Copiar ícone oficial
        run: cp icons/icon-512.png android-app/app/src/main/res/drawable/icon_otthos.png

      - name: Compilar APK
        run: gradle -p android-app --no-daemon assembleDebug

      - name: Renomear APK
        run: |
          mkdir -p apk-pronto
          cp android-app/app/build/outputs/apk/debug/app-debug.apk apk-pronto/OTTHI-V643.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: OTTHI-V643-APK
          path: apk-pronto/OTTHI-V643.apk
          if-no-files-found: error
          retention-days: 30
